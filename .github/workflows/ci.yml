name: Build and test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test private recipe API
        run: python3 -m unittest discover -s api -p 'test_*.py' -v
      - name: Build iPhone app for Simulator
        run: xcodebuild -project Lad.xcodeproj -scheme Lad -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Test pantry and menu logic on Simulator
        run: |
          LAD_SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for group in data["devices"].values() for device in group if device["name"].startswith("iPhone")))')
          xcodebuild -project Lad.xcodeproj -scheme Lad -configuration Debug -destination "platform=iOS Simulator,id=$LAD_SIM_ID" CODE_SIGNING_ALLOWED=NO test -quiet
