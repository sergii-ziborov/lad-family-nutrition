name: Lad
options:
  bundleIdPrefix: app.lad
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '19'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 'Ladlekin'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  Lad:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    sources:
      - path: Lad
      - path: Assets.xcassets
      - path: Legal
        type: folder
        buildPhase: resources
      - path: LadTests/Lad.storekit
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lad.family
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Lad/Lad.entitlements
        INFOPLIST_FILE: Lad/AppInfo.plist
        DEVELOPMENT_TEAM: XMS5ZC28UJ
      configs:
        Debug:
          ICLOUD_CONTAINER_ENVIRONMENT: Development
          LAD_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          LAD_ADMOB_BANNER_ID: ca-app-pub-3940256099942544/2435281174
        Release:
          CODE_SIGN_ENTITLEMENTS: Lad/AppStore.entitlements
          ICLOUD_CONTAINER_ENVIRONMENT: Production
          LAD_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          LAD_ADMOB_BANNER_ID: ''
          EXCLUDED_SOURCE_FILE_NAMES: [Lad.storekit, legacy-recipes.json]
    scheme:
      storeKitConfiguration: LadTests/Lad.storekit
      testTargets:
        - LadTests
  LadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LadTests
        excludes: [Lad.storekit, Fixtures]
      - path: LadTests/Fixtures
        type: folder
        buildPhase: resources
      - path: LadTests/Lad.storekit
        buildPhase: resources
    dependencies:
      - target: Lad
